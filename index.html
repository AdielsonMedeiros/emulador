<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f111a">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Retro NFC Touch - Web Player</title>
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

  <header id="app-header">
    <a href="./" class="logo-container">
      <span class="logo-badge">NFC TOUCH</span>
      <span class="logo-title">RETRO CART</span>
    </a>
    <button id="btn-open-settings" class="btn-header" aria-label="Configuracoes">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <main>
    <!-- NFC Landing / Game Card View -->
    <section id="game-card" class="game-card hidden">
      <div class="cover-wrapper">
        <img id="card-cover" class="cover-image" src="" alt="Capa do Jogo">
        <div class="cover-overlay"></div>
      </div>
      <div class="game-content">
        <h1 id="card-title" class="game-title">Carregando...</h1>
        <div class="game-meta">
          <span id="card-players" class="meta-chip">1 Jogador</span>
          <span id="card-year" class="meta-chip">1990</span>
          <span id="card-publisher" class="meta-chip">Nintendo</span>
          <span id="card-genre" class="meta-chip">Plataforma</span>
        </div>
        <p id="card-desc" class="game-desc"></p>
        <button id="btn-launch" class="btn-launch">
          <span>►</span> JOGAR AGORA
        </button>
      </div>
    </section>

    <!-- Full Catalog Grid View (quando nenhum jogo é passado na URL) -->
    <section id="catalog-view" class="catalog-section">
      <div class="catalog-toolbar">
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="search-input" class="search-input" placeholder="Buscar por título, gênero, ano..." autocomplete="off">
          <button id="search-clear" class="search-clear hidden" aria-label="Limpar busca">&times;</button>
        </div>
        <div id="platform-chips" class="platform-chips"></div>
      </div>

      <div class="catalog-status">
        <span id="catalog-count" class="catalog-count">54 jogos</span>
      </div>

      <div id="catalog-grid" class="catalog-grid"></div>

      <div id="empty-state" class="empty-state hidden">
        <p class="empty-title">Nenhum jogo encontrado</p>
        <p class="empty-subtitle">Tente buscar por outro termo ou selecione Todos os consoles.</p>
      </div>
    </section>
  </main>

  <!-- Modal de Configuracoes -->
  <div id="settings-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Configuracoes</h3>
        <button id="btn-close-settings" class="modal-close" aria-label="Fechar">&times;</button>
      </div>
      <div class="modal-body">
        <div class="setting-group">
          <label class="setting-label">Controle Direcional Touch (Celular)</label>
          <p class="setting-desc">Escolha como prefere controlar os jogos na tela de toque.</p>
          <div class="setting-radios">
            <label class="radio-card">
              <input type="radio" name="control-type" value="dpad">
              <div class="radio-content">
                <span class="radio-title">D-Pad Classico</span>
                <span class="radio-desc">Direcional em formato de cruz tradicional.</span>
              </div>
            </label>
            <label class="radio-card">
              <input type="radio" name="control-type" value="analog">
              <div class="radio-content">
                <span class="radio-title">Analogico (Joystick 360)</span>
                <span class="radio-desc">Alavanca virtual deslizante estilo manche.</span>
              </div>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Fullscreen Emulator Container -->
  <div id="emulator-viewport">
    <div id="game-frame"></div>
  </div>

  <script src="js/app.js?v=4"></script>
</body>
</html>
