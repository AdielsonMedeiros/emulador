<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f111a">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Retro NFC Touch - Web Player</title>
  <script>
    (function() {
      var p = window.location.pathname;
      if (!p.endsWith('/') && !p.includes('.')) {
        window.location.replace(p + '/' + window.location.search + window.location.hash);
      }
      if (new URLSearchParams(window.location.search).has('debug')) {
        var dbg = document.createElement('script');
        dbg.src = 'https://cdn.jsdelivr.net/npm/eruda';
        dbg.onload = function() { window.eruda && window.eruda.init(); };
        document.head.appendChild(dbg);
      }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=33">
</head>
<body>

  <header id="app-header">
    <a href="./" class="logo-container">
      <span class="logo-badge">NFC TOUCH</span>
      <span class="logo-title">RETRO CART</span>
    </a>
  </header>

  <main>
    <!-- NFC Landing / Game Card View -->
    <section id="game-card" class="game-card hidden">
      <div class="cover-wrapper">
        <img id="card-cover" class="cover-image" src="" alt="Capa do Jogo">
        <div class="cover-overlay"></div>
      </div>
      <div class="game-content">
        <h1 id="card-title" class="game-title">Carregando...</h1>
        <div class="game-meta">
          <span id="card-players" class="meta-chip">1 Jogador</span>
          <span id="card-year" class="meta-chip">1990</span>
          <span id="card-publisher" class="meta-chip">Nintendo</span>
          <span id="card-genre" class="meta-chip">Plataforma</span>
        </div>
        <p id="card-desc" class="game-desc"></p>
        <button id="btn-launch" class="btn-launch">
          <span>►</span> JOGAR AGORA
        </button>
      </div>
    </section>

    <!-- Full Catalog Grid View (quando nenhum jogo e passado na URL) -->
    <section id="catalog-view" class="catalog-section">
      <div class="catalog-toolbar">
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="search-input" class="search-input" placeholder="Buscar por titulo, genero, ano..." autocomplete="off">
          <button id="search-clear" class="search-clear hidden" aria-label="Limpar busca">&times;</button>
        </div>
        <div class="chips-row">
          <button type="button" id="btn-scroll-chips-left" class="chip-arrow-btn" aria-label="Rolar para esquerda" title="Rolar para esquerda" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <div id="platform-chips" class="platform-chips"></div>
          <button type="button" id="btn-scroll-chips-right" class="chip-arrow-btn" aria-label="Rolar para direita" title="Rolar para direita">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
      </div>

      <div class="catalog-status">
        <span id="catalog-count" class="catalog-count">204 jogos</span>
      </div>

      <div id="catalog-grid" class="catalog-grid"></div>

      <div id="catalog-pagination" class="catalog-pagination hidden">
        <div class="pagination-controls">
          <button type="button" id="btn-page-prev" class="btn-page-nav" disabled aria-label="Pagina Anterior">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            <span>Anterior</span>
          </button>
          
          <div class="pagination-pages-indicator">
            <span class="page-label">Pagina</span>
            <span id="pagination-current-page" class="page-current">1</span>
            <span class="page-separator">/</span>
            <span id="pagination-total-pages" class="page-total">1</span>
          </div>

          <button type="button" id="btn-page-next" class="btn-page-nav" aria-label="Proxima Pagina">
            <span>Proxima</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
        <span id="pagination-info" class="pagination-info"></span>
      </div>

      <div id="empty-state" class="empty-state hidden">
        <p class="empty-title">Nenhum jogo encontrado</p>
        <p class="empty-subtitle">Tente buscar por outro termo ou selecione Todos os consoles.</p>
      </div>
    </section>
  </main>

  <!-- Fullscreen Emulator Container -->
  <div id="emulator-viewport">
    <div id="game-frame"></div>
  </div>

  <script type="module" src="js/main.js?v=33"></script>
</body>
</html>
